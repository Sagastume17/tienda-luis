{% extends 'Base/base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Detalle Cliente</h2>
  <ul class="list-group">
    <li class="list-group-item"><strong>NIT:</strong> {{ cliente.nit }}</li>
    <li class="list-group-item"><strong>Nombre:</strong> {{ cliente.nombre }}</li>
    <li class="list-group-item"><strong>Dirección:</strong> {{ cliente.direccion }}</li>
    <li class="list-group-item"><strong>Teléfono:</strong> {{ cliente.telefono }}</li>
    <li class="list-group-item"><strong>Total:</strong> Q {{ cliente.total }}</li>
  </ul>
  <a href="{% url 'UpdateCli' cliente.pk %}" class="btn btn-warning mt-3">Editar</a>
  <a href="{% url 'ListaCli' %}" class="btn btn-secondary mt-3">Volver</a>
</div>
{% endblock %}
