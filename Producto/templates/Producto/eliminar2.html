{% extends "Base/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Confirmar eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.nombre }}</strong> (Código: {{ producto.codigo }}) de forma definitiva?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'ListaProd2' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
