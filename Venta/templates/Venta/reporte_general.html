{% extends 'Base/base.html' %}
{% block content %}
<h2>Tendencia de Ventas por Mes</h2>
<canvas id="ventasChart"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('ventasChart');
  const ventasData = {
    labels: [{% for v in ventas %}"{{ v.mes|date:'M Y' }}",{% endfor %}],
    datasets: [{
      label: 'Total Ventas',
      data: [{% for v in ventas %}{{ v.total_mes }},{% endfor %}],
      borderColor: 'blue',
      backgroundColor: 'lightblue',
      fill: true
    }]
  };
  new Chart(ctx, { type: 'line', data: ventasData });
</script>
{% endblock %}
