{% extends 'Base/base.html' %}
{% block content %}
<h2>Top Clientes</h2>
<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>Cliente</th>
      <th>Total Compras (Q)</th>
    </tr>
  </thead>
  <tbody>
    {% for c in clientes %}
    <tr>
      <td>{{ c.nombre }}</td>
      <td>{{ c.total_compras }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="2">No hay datos disponibles</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
