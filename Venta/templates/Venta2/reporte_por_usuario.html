{% extends 'Base/base.html' %}
{% block content %}
<h2>Ventas por Usuario</h2>
<table class="table table-striped table-hover">
  <thead class="table-success">
    <tr>
      <th>Usuario</th>
      <th>Total Vendido (Q)</th>
    </tr>
  </thead>
  <tbody>
    {% for u in usuarios %}
    <tr>
      <td>{{ u.usuario__username }}</td>
      <td>{{ u.total_vendido }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="2">No hay datos disponibles</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
