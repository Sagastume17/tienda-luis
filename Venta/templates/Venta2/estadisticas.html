{% extends 'Base/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-3 text-center">📊 Estadísticas de Ventas del Día</h2>

    <div class="row text-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Ganancias</h5>
                    <p class="card-text fs-4 text-success">Q.{{ ganancias }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Facturas FEL</h5>
                    <p class="card-text fs-4 text-primary">{{ fel_count }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Proformas</h5>
                    <p class="card-text fs-4 text-warning">{{ proforma_count }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
