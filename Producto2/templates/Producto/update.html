{% extends 'Base/base.html' %}



{% block content %}

<div class="container mt-5">
    <div class="card p-4">
        <h3 class="mb-4 text-center">Actualizar Producto</h3>

        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            <!-- Mostrar errores generales -->
            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %} 
            <div class="mb-3"> {{ field.label_tag }} {{ field }} {% if field.errors %} 
            <div class="text-danger small">{{ field.errors }}</div> {% endif %} </div> {% endfor %} 
            <div class="text-center"> <button type="submit" class="btn btn-primary">Actualizar</button>
            </div>
        </form>
    </div>
</div>







{% endblock %}
